name: aadya_plus_professional
description: "Aadya Plus Professional - Healthcare Professional App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  # Push provider for the professional app. FCM stays in place as a fallback
  # for installs where OneSignal is not configured.
  onesignal_flutter: ^5.3.4
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  permission_handler: ^11.3.1
  socket_io_client: ^3.1.4
  geolocator: ^13.0.2
  firebase_core:
  firebase_messaging:
  flutter_local_notifications:
  share_plus: ^12.0.2
  lucide_icons_flutter: ^3.1.19
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons:

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/banner.png
    # Plus Jakarta Sans, bundled so text renders in the right face offline
    # and on first launch; google_fonts picks these up by file name instead
    # of downloading. Licence: assets/google_fonts/OFL.txt.
    - assets/google_fonts/

flutter_icons:
  android: true
  ios: true # Set to false if you don't want to generate iOS icons right now
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png" # Fallback for older Android versions

  # --- Android Adaptive Icon Settings ---
  adaptive_icon_background: "#FFFFFF" # Replace with your desired background Hex color
  adaptive_icon_foreground: "assets/brand/icon.png" # Your transparent logo
