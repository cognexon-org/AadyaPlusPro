name: aadya_plus_professional
description: "Aadya Plus Professional - Healthcare Professional App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  iconsax: ^0.0.8
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons:

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true # Set to false if you don't want to generate iOS icons right now
  image_path: "assets/logo.png" # Fallback for older Android versions
  
  # --- Android Adaptive Icon Settings ---
  adaptive_icon_background: "#FFFFFF" # Replace with your desired background Hex color
  adaptive_icon_foreground: "assets/logo.png" # Your transparent logo
